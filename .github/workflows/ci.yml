name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest -q

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Manifest matches the module surface
        run: python -m pytest -q test_manifest_contract.py

      - name: Manifest is valid JSON with a well-formed shape
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          for key in ("id", "name", "version", "routePath", "navItem", "endpoints"):
              if key not in manifest:
                  sys.exit(f"manifest.json is missing required key: {key}")
          if manifest["id"] != "curate":
              sys.exit(f"unexpected plugin id: {manifest['id']}")
          print(f"manifest ok: {manifest['id']} v{manifest['version']}, "
                f"{len(manifest['endpoints'])} endpoints")
          PY

  no-mission-control-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plugin must not import Mission Control internals
        run: |
          # The plugin owns its own BDH integration. Importing MC core modules
          # (synthesis_activity_proxy, session_synthesis_rejections, ...) would
          # recreate the boundary violation this repo was split out to remove.
          # hermes_paths is the one allowed host primitive: it resolves the
          # Hermes home/profile and carries no plugin domain logic.
          FORBIDDEN='synthesis_activity_proxy|session_synthesis_rejections|local_telemetry_server|mission_control_'
          if grep -rnE "^\s*(import|from)\s+($FORBIDDEN)" --include='*.py' .; then
            echo "::error::plugin imports Mission Control internals"
            exit 1
          fi
          echo "no Mission Control internals imported"
